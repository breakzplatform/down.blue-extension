<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="extName"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <h1 class="brand">
        <svg viewBox="0 0 100 100" width="44" height="44" aria-hidden="true">
          <rect width="100" height="100" fill="var(--ink-down)"/>
          <g transform="translate(50 50) scale(0.85) translate(-50 -50)">
            <rect x="26" y="26" width="56" height="56" fill="#000"/>
            <rect x="18" y="18" width="56" height="56" fill="#000"/>
            <rect x="22" y="22" width="48" height="48" fill="#F4F1EA"/>
            <path d="M46 29v22M34 41l12 12 12-12M32 63h28" fill="none" stroke="#000" stroke-width="5.5" stroke-linecap="square"/>
          </g>
        </svg>
        <span data-i18n="extName"></span>
      </h1>
      <p data-i18n="extDescription"></p>
      <button id="theme-btn" type="button"></button>
    </header>

    <section>
      <h2 data-i18n="optSupportedSites"></h2>
      <p data-i18n="optSupportedNote"></p>
      <ul id="builtin-list"></ul>
    </section>

    <section>
      <h2 data-i18n="optYourSites"></h2>
      <ul id="custom-list"></ul>
      <form id="add-site-form">
        <input type="text" id="site-input" placeholder="example.social">
        <button type="submit" data-i18n="optAddSite"></button>
      </form>
      <div id="site-error" role="status" aria-live="polite"></div>
    </section>

    <section>
      <label class="checkbox-label">
        <input type="checkbox" id="footer-all-posts">
        <span data-i18n="optFooterAllPosts"></span>
      </label>
    </section>

    <footer>
      <p data-i18n="optPrivacyNote"></p>
    </footer>
  </main>
  <script src="../lib/shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
